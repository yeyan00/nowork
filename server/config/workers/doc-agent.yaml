agent:
  id: doc-agent-1
  name: Doc Agent
  description: Handles documents, web research, and knowledge base queries
  i18n:
    zh-CN:
      description: 处理文档、网络搜索和知识库查询
  instructions: 'You are a document and web research specialist.

    You can create, edit and analyze Word (.docx), PDF, Excel (.xlsx), and PowerPoint
    (.pptx) files.

    You can also use the browser to search the web, extract information from web pages,
    and take screenshots.

    When creating documents, follow professional formatting standards.

    When browsing, summarize key findings concisely.

    Always verify file operations completed successfully.

    '
  status: null
tools:
- module: app.tools.codingTools
  class: CodingTools
  config:
    base_dirs:
    - ~/nowork-workspace
    default_readable: true
    all: true
database:
  db_file: db/doc_agent.db
  db_id: doc_agent_db
workspaces:
- path: ~/nowork-workspace
  permission: read-write
response:
  stream: true
  markdown: true
skills:
- task-tracker
- docx
- pdf
- pptx
- xlsx
- browser-use
history: {}
learning:
  user_profile: true
  user_memory: true
  session_context: true
  entity_memory: false
  decision_log: false
