[package]
name = "nowork"
version = "0.0.9"
description = "nowork desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
rfd = "0.15"
dunce = "1"  # Simplify Windows UNC paths (\\?\) to regular DOS paths
tauri-plugin-notification = "2.3.3"
sys-locale = "0.3.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]


